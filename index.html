<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="프리미엄 로또 번호 추첨 사이트 - 행운의 숫자를 확인하세요">
    <title>프리미엄 로또 번호 추첨기</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+KR:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="theme-toggle-wrapper">
                <button id="theme-toggle" class="theme-btn">☀️ 화이트 모드</button>
            </div>
            <h1>행운의 로또 번호</h1>
            <p>당신의 인생을 바꿀 6개의 숫자</p>
        </header>

        <main>
            <div class="balls-container" id="balls-container">
                <div class="placeholder-text">버튼을 눌러 추첨을 시작하세요</div>
            </div>

            <div class="toggle-container">
                <label class="toggle-switch">
                    <input type="checkbox" id="bonus-toggle">
                    <span class="slider"></span>
                </label>
                <span class="toggle-label">보너스 번호 포함</span>
            </div>

            <button id="draw-btn" class="draw-btn">
                <span class="btn-text">번호 추첨하기</span>
                <span class="btn-glow"></span>
            </button>

            <section class="contact-section">
                <h2>🤝 제휴 및 문의</h2>
                <form action="https://formspree.io/f/mzdoralv" method="POST" class="contact-form">
                    <div class="form-group">
                        <input type="text" name="name" placeholder="성함 또는 회사명" required>
                    </div>
                    <div class="form-group">
                        <input type="email" name="email" placeholder="답변 받으실 이메일" required>
                    </div>
                    <div class="form-group">
                        <textarea name="message" placeholder="문의 내용" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">문의 보내기</button>
                </form>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
